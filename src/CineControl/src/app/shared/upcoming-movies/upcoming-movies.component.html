<div class="section">
  <h2>Premiery wkrótce</h2>
  <app-carousel
    [items]="upcomingMovies"
    [itemTemplate]="upcomingMovieTemplate"
    [autoPlay]="false"
  ></app-carousel>
</div>

<!-- Szablon dla nadchodzących premier -->
<ng-template #upcomingMovieTemplate let-movie>
  <div class="movie-slide" *ngIf="movie">
    <img [src]="movie.posterUrl" alt="{{ movie.title }}" />
    <div class="movie-content">
      <h3>{{ movie.title }}</h3>
      <p>Premiera: {{ movie.releaseDate | date }}</p>
      <button mat-button [routerLink]="['/movie-details', movie.id]">Więcej</button>
    </div>
  </div>
</ng-template>
