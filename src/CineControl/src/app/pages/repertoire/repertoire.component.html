<app-promotions></app-promotions>
<form [formGroup]="scheduleForm" class="schedule-form">
  <!-- Pole miasta z podpowiedziami -->
  <mat-form-field appearance="fill">
    <mat-label>Wpisz miasto</mat-label>
    <input
      type="text"
      matInput
      formControlName="city"
      [matAutocomplete]="auto"
    />
    <mat-autocomplete
      #auto="matAutocomplete"
      (optionSelected)="onCitySelected($event.option.value)"
    >
      <mat-option *ngFor="let city of filteredCities" [value]="city">
        {{ city }}
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>

  <!-- Lista rozwijana z kinami -->
  <mat-form-field
    appearance="fill"
    *ngIf="cinemas && cinemas.length > 0"
  >
    <mat-label>Wybierz kino</mat-label>
    <mat-select
      formControlName="cinema"
      (selectionChange)="onCinemaSelected()"
    >
      <mat-option *ngFor="let cinema of cinemas" [value]="cinema.id">
        {{ cinema.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Kalendarz -->
  <mat-form-field
    appearance="fill"
    *ngIf="scheduleForm.get('cinema')?.value"
  >
    <mat-label>Wybierz datę</mat-label>
    <input
      matInput
      [matDatepicker]="picker"
      formControlName="date"
      (dateChange)="onDateSelected()"
    />
    <mat-datepicker-toggle
      matSuffix
      [for]="picker"
    ></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>
</form>

<!-- Wyświetlanie seansów -->
<div *ngIf="groupedSeances.length > 0" class="grouped-seances">
  <div *ngFor="let group of groupedSeances; let last = last" class="movie-row">
    <div class="poster">
      <img [src]="'data:image/jpeg;base64,' + group.posterB64" alt="{{ group.movieTitle }}" class="movie-poster" />
    </div>
    <div class="movie-details">
      <h3 class="movie-title">{{ group.movieTitle }}</h3>
      <div class="showtimes">
        <button mat-button 
                *ngFor="let show of group.shows" 
                class="time-button"
                (click)="goToBooking(show.seanceId)">
          {{ show.time }}
        </button>
      </div>
    </div>
  </div>
  <hr class="separator" />
  
  <!-- Separator pod każdym filmem oprócz ostatniego -->
  <hr class="separator" />
</div>
